<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Contribution</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 640px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem;
      line-height: 1.5;
    }
    button { font: inherit; padding: 0.45rem 0.9rem; cursor: pointer; }
    #contributor-student-id { margin: 1rem 0; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Team Contribution</h1>

  <button id="load-contributor" type="button">Show Contributor</button>

  <p id="contributor-student-id"></p>

  <p><a href="index.html">Back to Task Manager</a></p>

  <script>
    const button = document.getElementById("load-contributor");
    const output = document.getElementById("contributor-student-id");

    button.addEventListener("click", async () => {
      try {
        const response = await fetch("contribution.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("Could not load contribution.json (HTTP " + response.status + ").");
        }
        const data = await response.json();
        output.textContent = "Contributor Student ID: " + data.contributorStudentId;
      } catch (error) {
        output.textContent = error.message;
      }
    });
  </script>
</body>
</html>
